aid: buoy-health
name: Buoy Health
description: >-
  Buoy Health is a Boston-based digital health company whose clinically-trained AI symptom checker and
  triage engine is offered to health systems, payers and employers as an embeddable API. The Buoy
  Symptom Checker API v2.0 exposes a conversational triage interview as REST resources — interviews,
  complaints, queries, intents, questions and results — so an integrator can create a de-identified
  anonymous interview from basic demographics, accept a chief complaint, walk an adaptively generated
  question sequence, and read back a differential diagnosis with a recommended level of care and
  customizable care-handoff destinations. The API is OAuth 2.0 protected against an Auth0-backed
  authorization server with separate sandbox and production environments, is documented on ReadMe with
  a published OpenAPI 3.0.1 definition and an llms.txt, and Buoy is HITRUST CSF certified.
