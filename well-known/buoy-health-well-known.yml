gaps:
- id: no-security-txt
  detail: >-
    No RFC 9116 security.txt on any Buoy host, even though the public security page publishes a real
    security contact (security@buoyhealth.com). Publishing /.well-known/security.txt would make that
    contact machine-discoverable.
- id: no-oauth-protected-resource
  detail: >-
    The API hosts publish no RFC 9728 protected-resource metadata, so a client cannot mechanically
    discover which authorization server protects api.buoyhealth.com — the binding is documentation-only.
- id: no-api-catalog
  detail: No RFC 9727 /.well-known/api-catalog linking Buoy's published API descriptions.
