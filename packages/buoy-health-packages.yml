summary: >-
  Buoy publishes NO client SDK for the Symptom Checker API in any language. One first-party npm
  package exists — buoy-breadcrumbs — but it is an internal React UI component, not an API client, and
  it was last published in 2022. Integrators are expected to hand-roll HTTP against the OpenAPI or
  import the public Postman collection.
