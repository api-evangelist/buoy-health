gaps:
- id: no-api-client-sdk
  detail: >-
    Zero client libraries for an API whose buyers are health systems and payers — the integration
    teams least likely to want to hand-roll OAuth 2.0 plus a stateful interview state machine. A
    generated TypeScript and Python client from the existing OpenAPI would be close to free.
