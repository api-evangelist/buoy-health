cascades:
- trigger: complaints_delete
  effect: Interview resets to `input` mode and every question answered after that complaint is discarded.
- trigger: complaints_create
  effect: If the interview was in `protocol` or `differential` mode it is reset to `input`.
- trigger: questions_update
  effect: >-
    The interview truncates to that question's position and regenerates the entire downstream
    sequence, so previously read Question tokens become stale.
