summary: >-
  Six addressable entities hang off a single root aggregate — the Interview. Every entity is keyed by
  an opaque UUID `token` with no type prefix, and every child carries an `interview` back-reference.
  The graph is a star, not a mesh: Complaint, Intent, Question and Result all belong to exactly one
  Interview and none reference each other. Profile and Location are embedded value objects on the
  Interview rather than independently addressable resources.
identifiers:
  style: uuid
  field: token
  prefixed: false
  note: >-
    Tokens are bare UUID4s. Nothing in an identifier distinguishes a complaint token from an intent
    token, so a misrouted token surfaces only as a 404.
entities:
- name: Interview
  root: true
  schema: ReadUpdateInterviewSchema
  key: token
  path: /interviews/{interview_token}/
  operations: [interviews_anonymous, interviews_read, interviews_update]
  fields: [token, start_time, end_time, profile, location, mode, should_display_alarm, _links, _msg]
  description: >-
    The triage session aggregate. Holds the de-identified profile, an optional location, the current
    mode (input / protocol / differential), an alarm display flag, and the hypermedia _links that
    advance the state machine.
- name: Complaint
  schema: ReadComplaintSchema
  key: token
  path: /complaints/{complaint_token}/
  operations: [complaints_list, complaints_create, complaints_read, complaints_update, complaints_delete]
  fields: [token, interview, query, interpretations, clarification, _links]
  description: >-
    A chief complaint submitted as free text (`query`). The AI returns candidate `interpretations`;
    the client picks one and writes it back as the `clarification`.
- name: Interpretation
  schema: ReadInterpretationSchema
  key: token
  addressable: false
  fields: [token, title, description]
  description: An AI-generated candidate reading of a free-text complaint. Embedded in Complaint, never fetched directly.
- name: Clarification
  schema: ReadClarificationSchema
  key: token
  addressable: false
  fields: [token]
  description: The interpretation the user selected, written back onto the Complaint.
- name: Intent
  schema: IntentSchema
  key: token
  path: /intents/{intent_token}/
  operations: [intents_list, intents_create, intents_read, intents_update, intents_delete]
  fields: [token, interview, event, decision]
  description: >-
    A captured user intention at a lifecycle event (INTERVIEW_START or INTERVIEW_RESULT) with the
    decision the user made — the hook integrators use to measure care-navigation outcomes.
- name: Question
  schema: ReadQuestionSchema
  key: token
  path: /questions/{question_token}/
  operations: [questions_list, questions_read, questions_update, questions_explain]
  fields: [token, text, choice, media, options, answer, interview, media_alttext, _links]
  description: >-
    An adaptively generated interview question. `options` are the selectable answers; `answer` is the
    user's selection. Updating an answer truncates and regenerates every downstream question.
- name: Option
  schema: ReadOptionSchema
  key: token
  addressable: false
  fields: [token, text, media, exclusive, media_alttext, free_text]
  description: A selectable answer choice on a Question. `exclusive` marks a choice that cannot be combined with others.
- name: Answer
  schema: ReadAnswerSchema
  addressable: false
  description: The user's selection for a Question, written via questions_update.
- name: QuestionExplanation
  schema: QuestionExplainSchema
  key: token
  path: /questions/{question_token}/explain/
  operations: [questions_explain]
  fields: [token, interview, diagnosis, predictors]
  description: >-
    Explainability projection of a Question — the candidate diagnosis and the predictors that caused
    the engine to ask it. The clinical-transparency surface of the API.
- name: Result
  schema: ReadResultsSchema
  key: token
  path: /results/{result_token}/
  operations: [results_read]
  fields: [token, alarm, undiagnosed, differential]
  description: >-
    The terminal output — a ranked `differential` of candidate conditions with an `alarm` flag for
    emergency escalation and an `undiagnosed` flag when the engine reached no conclusion. Reached by
